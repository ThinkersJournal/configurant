[package]
name = "configurant-secretant"
version = "0.8.8"
edition = "2024"
rust-version = "1.95"
description = "SecretAnt as a ConfigurAnt secret source: source = \"secretant:<name>\" reads a secret from a SecretAnt store at load time."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/configurant"
readme = "README.md"
keywords = ["configuration", "config", "secrets", "secretant", "schema"]
categories = ["config"]

[dependencies]
configurant-secrets = { version = "0.8.8", path = "../configurant-secrets" }
secretant = "0.2.4"

[dev-dependencies]
configurant = { version = "0.8.8", path = "../.." }
tempfile = "3.27.0"
