[package]
name = "configurant-tui"
version = "0.5.28"
edition = "2024"
rust-version = "1.95"
description = "Terminal front end for ConfigurAnt: edit a project's configuration file against its schema, review the changes, and confirm before anything is written."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/configurant"
readme = "README.md"
keywords = ["configuration", "tui", "config", "schema"]
categories = ["config", "command-line-utilities"]

[[bin]]
name = "configurant-tui"
path = "src/main.rs"

[dependencies]
configurant = { version = "0.5.16", path = "../..", features = ["persistant-blocking"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
configurant-scan = { version = "0.5.16", path = "../configurant-scan", optional = true }

[features]
# "Add from scan" (key `a`, flag `--scan <root>`): propose schema entries from the variables a Rust project reads.
# Off by default: it needs a language server (rust-analyzer) at run time.
scan = ["dep:configurant-scan"]

[dev-dependencies]
persistant = { version = "0.11.7", default-features = false, features = ["registry"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
