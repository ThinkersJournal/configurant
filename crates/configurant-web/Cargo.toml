[package]
name = "configurant-web"
version = "0.5.42"
edition = "2024"
rust-version = "1.95"
description = "Browser front end for ConfigurAnt: a wizard served on loopback by HTTPAnt, one visitor, with a launch token; the same questions as the terminal and window front ends, and nothing is written until the review is confirmed."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/configurant"
readme = "README.md"
keywords = ["configuration", "wizard", "config", "schema", "http"]
categories = ["config", "web-programming::http-server"]

[dependencies]
configurant = { version = "0.5.16", path = "../.." }
httpant = "0.5.19"
getrandom = "0.4.3"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }
