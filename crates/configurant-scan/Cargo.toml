[package]
name = "configurant-scan"
version = "0.8.2"
edition = "2024"
rust-version = "1.95"
description = "Scan assist for ConfigurAnt: find the environment variables a Rust project reads (language-server confirmed) and propose schema entries for a human to accept. Suggests only; writes nothing."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/configurant"
readme = "README.md"
keywords = ["configuration", "config", "schema", "lsp", "scan"]
categories = ["config", "development-tools"]

[[bin]]
name = "configurant-scan"
path = "src/main.rs"

# Test support: a language server that cannot resolve anything. Cargo gives tests `CARGO_BIN_EXE_<name>` for bins only;
# the feature is off by default, so `cargo install` and `cargo publish` do not ship it. The self dev-dependency turns it on for tests.
[[bin]]
name = "configurant-scan-fake-lsp"
path = "src/bin/configurant-scan-fake-lsp.rs"
required-features = ["test-support"]

[features]
test-support = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
configurant = { version = "0.8.2", path = "../.." }
lsp-bridge = "0.4.0"
lsp-types = "0.97"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
url = "2.5"
toml = "1.1.8"

[dev-dependencies]
configurant-scan = { path = ".", features = ["test-support"] }
