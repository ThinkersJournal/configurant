# ConfigurAnt schema for an AntSpawn job spec (first customer). The schema is data: AntSpawn keeps its own
# serde types and loads its spec through configurant, with no generated code.
#
# `[[mount]]` and `[[output]]` are arrays of tables and `job.env` is a map: all three come from the job file only
# (no environment variable or flag). Cross-field rules (a `ro` mount needs a `host`, guest paths stay inside the
# work dir) are AntSpawn's own checks; the schema checks names, types and choices.

[project]
name = "antspawn-job"
version = "0.1.0"
summary = "One AntSpawn job: what it runs and what it needs"
schema_version = 1
env_prefix = "ANTSPAWN_JOB_"

[[value]]
key = "job.name"
type = "string"
required = true
description = "job name (not empty)"

[[value]]
key = "job.cmd"
type = "list"
required = true
description = "program and arguments; the first element is the program"

[[value]]
key = "job.cwd"
type = "string"
description = "working directory inside the environment"

# Names only, never values: a name is not a secret, so this is not `secret = true`.
[[value]]
key = "job.secrets"
type = "list"
default = []
description = "secret NAMES resolved at run time (this AntSpawn version refuses a non-empty list)"

[[value]]
key = "limits.cpu"
type = "int"
min = 1
description = "CPU ceiling; unset means the launcher's default, not unlimited"

[[value]]
key = "limits.ram_mb"
type = "int"
min = 1
description = "memory ceiling in MB; unset means the launcher's default"

[[value]]
key = "limits.time_s"
type = "int"
min = 1
description = "time ceiling in seconds; unset means the launcher's default"

[[value]]
key = "needs.network"
type = "enum"
choices = ["off", "on"]
default = "off"
description = "network access for the job"

[[value]]
key = "needs.gpu"
type = "enum"
choices = ["none", "cuda", "vulkan"]
default = "none"
description = "GPU the job needs"

[[value]]
key = "needs.tools"
type = "list"
default = []
description = "tools the environment must provide"

[[value]]
key = "needs.require"
type = "list"
default = ["isolation.no-read-outside", "isolation.no-write-outside", "clean-slate-next-run", "kills-runaway-process"]
description = "capability ids required beyond those network and gpu imply"

[[value]]
key = "needs.prefer"
type = "list"
default = []
description = "launcher ids in order of importance"

[[map]]
key = "job.env"
value_type = "string"
description = "environment variables for the job (names and values; never put a secret here)"

[[table]]
key = "mount"
description = "directories the job may see; none are visible unless declared"

[[table.field]]
key = "host"
type = "path"
description = "source on the host (a scratch mount has none)"

[[table.field]]
key = "guest"
type = "path"
required = true
description = "path inside the environment, relative to the work dir"

[[table.field]]
key = "mode"
type = "enum"
choices = ["ro", "rw", "scratch"]
required = true
description = "ro copies in, scratch is empty and discarded, rw is refused by this AntSpawn version"

[[table]]
key = "output"
description = "files copied out when the job ends"

[[table.field]]
key = "guest"
type = "path"
required = true
description = "path inside the environment, relative to the work dir"

[[table.field]]
key = "name"
type = "string"
required = true
description = "name the result is stored under"
