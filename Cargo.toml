[workspace]
members = ["crates/configurant-tui", "crates/configurant-gui", "crates/configurant-scan", "crates/configurant-secrets", "crates/configurant-web"]

[package]
name = "configurant"
version = "0.6.2"
edition = "2024"
rust-version = "1.95"
description = "Schema-first configuration: declare values in a TOML schema, layer defaults, file, environment and command line, validate with named errors, explain where each value came from. No generated code; secrets never printed."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/configurant"
readme = "README.md"
keywords = ["configuration", "config", "schema", "secrets", "settings"]
categories = ["config", "command-line-utilities"]

[[bin]]
name = "configurant"
path = "src/main.rs"

[features]
# The `ports` module: validates a port or a `host:port` address (docs/MODULES.md section 2). Pure text, no dependency.
ports = []
# The `logging` module: validates a log level or a filter (docs/MODULES.md section 4). Pure text, no dependency.
logging = []
# The `paths` module: validates a path lexically (docs/MODULES.md section 3). Pure text, no dependency.
paths = []
# PersistAnt as a module: choice lists and data-transfer plans from its backend registry. Off by default
# so the core stays light; the application chooses which backends exist by enabling persistant's own features.
persistant = ["dep:persistant"]
# `PersistantModule::transfer_blocking`: runs the async transfer on a current-thread Tokio runtime of its own.
persistant-blocking = ["persistant", "dep:tokio"]

[dependencies]
persistant = { version = "0.14.3", optional = true, default-features = false, features = ["registry"] }
tokio = { version = "1.54.1", optional = true, default-features = false, features = ["rt"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
